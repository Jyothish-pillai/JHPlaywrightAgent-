                    - generic [ref=e2361]:
                      - paragraph [ref=e2362]: I purchased the HP OmniBook 5 OLED (Snapdragon X, 16GB, 512GB) and received it today. The screen was completely non-functional from the very first boot — a clear case of Dead on Arrival (DOA).
                      - paragraph
                      - paragraph [ref=e2363]: Amazon completed an Open Box Inspection at delivery with photos taken by the delivery associate. Despite this, and despite this being a clear DOA product that has NEVER worked from Day 1, Amazon has refused immediate replacement under their own 10-day replacement policy.
                      - paragraph
                      - paragraph [ref=e2364]: Instead of honouring their replacement policy, Amazon is hiding behind a bureaucratic technician visit process — adding unnecessary delays for a product that clearly needs replacement, not repair.
                      - paragraph
                      - paragraph [ref=e2365]: I paid for a brand new laptop. I expected a working product. What I got was a defective unit and a company unwilling to honour its own policy.
                      - paragraph
                      - paragraph [ref=e2366]: Buyer beware — Amazon's 10-day replacement policy may not be as straightforward as advertised for high-value electronics.
                      - paragraph
                      - paragraph [ref=e2367]: Update to follow once resolution is received.
